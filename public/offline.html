<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7C3AED" />
    <title>Offline · Unsaid Notes</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        padding-top: max(1.5rem, env(safe-area-inset-top, 0px));
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #faf7f2;
        color: #1f2937;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.55;
        color: #6b7280;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.65rem 1.35rem;
        border-radius: 9999px;
        border: none;
        background: #7c3aed;
        color: #fff;
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
      }
      button:active {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You&rsquo;re offline</h1>
      <p>
        Unsaid Notes needs a connection to open new pages. If you already have a tab open, what you
        typed there stays until you leave or refresh.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
